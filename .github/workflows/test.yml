name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck python3-websocket
      - run: shellcheck bin/*.sh install.sh uninstall.sh
      - run: python3 -m unittest discover -s tests -v
